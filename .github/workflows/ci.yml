name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  delivery-contract:
    name: Delivery Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check out matching Lex source
        uses: actions/checkout@v6
        with:
          repository: Guffawaffle/lex
          ref: main
          path: lex-core

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build native dependencies
        run: npm rebuild better-sqlite3-multiple-ciphers

      - name: Run delivery-contract tests
        run: npm test

      - name: Run packed-artifact smoke test
        run: npm run test:pack
        env:
          LEX_MCP_LEX_ROOT: ${{ github.workspace }}/lex-core
