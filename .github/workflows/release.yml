name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Signed release tag or version (e.g., v3.0.0 or 3.0.0)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  validate-tag:
    name: Validate Release Tag
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release.outputs.tag }}
      release_version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve release identity
        id: release
        env:
          RAW_RELEASE: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
        run: |
          if [[ ! "$RAW_RELEASE" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "❌ Invalid release version: $RAW_RELEASE"
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          tag="v${version}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "✅ Resolved release $tag"

      - name: Verify signed release tag
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          TRUSTED_GPG_KEYS: ${{ secrets.TRUSTED_GPG_KEYS }}
        run: |
          if [ -z "$TRUSTED_GPG_KEYS" ]; then
            echo "❌ TRUSTED_GPG_KEYS is required to verify release tags"
            exit 1
          fi
          echo "$TRUSTED_GPG_KEYS" | base64 -d | gpg --import
          if ! git rev-parse --verify "${RELEASE_TAG}^{tag}" >/dev/null 2>&1; then
            echo "❌ $RELEASE_TAG must exist and be an annotated tag"
            exit 1
          fi
          if [ "${{ github.event_name }}" = "push" ] && \
             [ "$(git rev-parse "${RELEASE_TAG}^{commit}")" != "$GITHUB_SHA" ]; then
            echo "❌ Pushed ref does not resolve to $RELEASE_TAG"
            exit 1
          fi
          git verify-tag "$RELEASE_TAG"
          echo "✅ Tag signature verified"

      - name: Verify release package alignment
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          git checkout --detach "$RELEASE_TAG"
          node - "$RELEASE_VERSION" <<'NODE'
          const expected = process.argv[2];
          const pkg = require('./package.json');
          if (pkg.version !== expected) {
            throw new Error(`Package version ${pkg.version} does not match release ${expected}`);
          }
          if (pkg.dependencies?.['@smartergpt/lex'] !== expected) {
            throw new Error(
              `Lex dependency ${pkg.dependencies?.['@smartergpt/lex']} does not match release ${expected}`,
            );
          }
          NODE
          echo "✅ Package and Lex dependency align at $RELEASE_VERSION"

  verify-package:
    name: Verify Package
    needs: validate-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-tag.outputs.release_tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Check out the matching Lex release
        uses: actions/checkout@v6
        with:
          repository: Guffawaffle/lex
          ref: ${{ needs.validate-tag.outputs.release_tag }}
          path: lex-core

      - name: Verify post-publish Lex lock integrity
        run: |
          node <<'NODE'
          const pkg = require('./package.json');
          const lock = require('./package-lock.json');
          const version = pkg.dependencies['@smartergpt/lex'];
          const entry = lock.packages?.['node_modules/@smartergpt/lex'];
          const expected = `https://registry.npmjs.org/@smartergpt/lex/-/lex-${version}.tgz`;
          if (entry?.version !== version || entry?.resolved !== expected) {
            throw new Error('Lex lock entry does not match the exact public release');
          }
          if (typeof entry.integrity !== 'string' || !entry.integrity.startsWith('sha512-')) {
            throw new Error(
              'Lex lock integrity is missing. After publishing Lex, run npm install --package-lock-only --ignore-scripts, commit package-lock.json, then tag lex-mcp.',
            );
          }
          NODE

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Lex build dependencies
        working-directory: lex-core
        run: npm ci --ignore-scripts

      - name: Build native dependencies
        run: npm rebuild better-sqlite3-multiple-ciphers

      - name: Run delivery-contract tests
        run: npm test

      - name: Run packed-artifact smoke test
        run: npm run test:pack
        env:
          LEX_MCP_LEX_ROOT: ${{ github.workspace }}/lex-core

      - name: Verify entry point loads
        run: |
          node -e "
            import('@smartergpt/lex/mcp-server')
              .then(() => console.log('✅ MCP server module loads'))
              .catch(e => { console.error('❌ Failed:', e.message); process.exit(1); });
          "

      - name: Verify package contents
        run: |
          echo "=== Package files ==="
          npm pack --dry-run
          echo ""
          echo "=== Version check ==="
          node -e "
            import { readFileSync } from 'fs';
            const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
            console.log('Package: ' + pkg.name + '@' + pkg.version);
            console.log('Lex dep:  ' + pkg.dependencies['@smartergpt/lex']);
          "
          echo "✅ Package looks good"

      - name: Create tarball
        run: npm pack

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: smartergpt-lex-mcp-*.tgz
          retention-days: 7
          if-no-files-found: error

  # NOTE: npm publish is done manually (2FA requires interactive auth).
  # Run: cd lex-mcp && npm publish --access public
  # Uncomment when granular access token with publish scope is configured.

  create-github-release:
    name: Create GitHub Release
    needs: [validate-tag, verify-package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.validate-tag.outputs.release_tag }}

      - name: Generate changelog
        id: changelog
        env:
          RELEASE_TAG: ${{ needs.validate-tag.outputs.release_tag }}
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "${RELEASE_TAG}^" 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            echo "Generating changelog from $PREV_TAG to $RELEASE_TAG"
            git log "${PREV_TAG}..${RELEASE_TAG}" --pretty=format:"- %s (%h)" > CHANGELOG.txt
          else
            echo "First release - listing all commits"
            git log "$RELEASE_TAG" --pretty=format:"- %s (%h)" > CHANGELOG.txt
          fi

      - name: Download tarball
        uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate-tag.outputs.release_tag }}
          name: Release ${{ needs.validate-tag.outputs.release_tag }}
          body_path: CHANGELOG.txt
          files: smartergpt-lex-mcp-*.tgz
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
